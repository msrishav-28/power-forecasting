databases:
  - name: powergrid-db
    databaseName: powergrid
    user: poweruser
    plan: free

services:
  - type: web
    name: powergrid-eri-api
    runtime: python
    rootDir: backend
    # Training is best-effort: if it fails (e.g. Prophet/cmdstanpy regression),
    # the build still succeeds and the runtime falls back to the model artifacts
    # committed under models/. All 10 artifacts are tracked in git.
    buildCommand: pip install -r requirements.txt && cd .. && (python train_models_fast.py || echo "[WARN] Build-time training failed; falling back to committed model artifacts in models/")
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: powergrid-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3
      # Required: comma-separated list of Vercel/custom-domain origins.
      # Set in the Render dashboard at first deploy, e.g. https://<your-app>.vercel.app
      - key: FRONTEND_ORIGINS
        sync: false
      # Optional integrations — leave blank to let the backend use graceful fallbacks.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: powergrid-public-docs
      - key: HUGGINGFACE_MODEL_REPO
        sync: false
      - key: LLM_CACHE_TTL_HOURS
        value: "6"
